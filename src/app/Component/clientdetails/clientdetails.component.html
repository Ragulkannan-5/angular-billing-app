<div style="display: flex; justify-content: space-around;"><p mat-dialog-title >Enter Client Details</p></div>
<mat-divider></mat-divider>
<form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="dialog-content">
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" required />
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <textarea matInput rows="2" formControlName="address" required></textarea>
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" maxlength="10" />
        <mat-error *ngIf="clientForm.get('phone')?.invalid">
          Enter a valid 10-digit phone number
        </mat-error>
      </mat-form-field>
    </div>
<!-- 
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Estimate No</mat-label>
        <input matInput formControlName="estimateNo" required />
      </mat-form-field>
    </div> -->

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Estimate Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="estimateDate" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="clientForm.invalid" (click)="save()">Save</button>
  </mat-dialog-actions>
</form>
