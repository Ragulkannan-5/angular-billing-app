<div style="display: flex; 
                justify-content: space-around;
                align-items: center;">
                <p mat-dialog-title>{{ isEdit ? 'Edit Product' : 'Add Product' }}</p>
            </div>
<mat-divider></mat-divider>

<mat-dialog-content style="display: flex; 
                justify-content: space-around;
                align-items: center;">
  <form [formGroup]="productForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="productName">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
  <mat-label>Category</mat-label>
  <mat-select formControlName="category">
    <mat-option *ngFor="let category of categories" [value]="category">
      {{ category }}
    </mat-option>
  </mat-select>
</mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Shortcut</mat-label>
      <input matInput formControlName="shortcut">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Add Stack</mat-label>
      <input matInput type="number" formControlName="addStack">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-divider></mat-divider>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()">Save</button>
</mat-dialog-actions>
