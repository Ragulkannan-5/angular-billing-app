<div class="container mt-4">
<div class="row mb-3 align-items-center g-2">
  <!-- Search Field -->
  <div class="col-12 col-md-auto">
    <mat-form-field appearance="outline" style="min-width: 250px;">
      <mat-label>Search Products</mat-label>
      <input matInput placeholder="Type to search..." [(ngModel)]="searchText" (input)="applyFilter()" />
      <button mat-icon-button matSuffix *ngIf="searchText" style="zoom: 0.6;" (click)="searchText=''; applyFilter()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- Category Dropdown -->
  <div class="col-12 col-md-auto">
  <mat-form-field appearance="outline" style="min-width: 200px;">
  <mat-label>Category</mat-label>
  <mat-select formControlName="category" (selectionChange)="categoryfilter($event.value)">
    <mat-option value="rest">Select</mat-option>
    <mat-option *ngFor="let category of categories" [value]="category">
      {{ category }}
    </mat-option>
  </mat-select>
</mat-form-field>

  </div>

  <!-- Action Button -->
  <div class="col-12 col-md-auto">
    <button mat-raised-button color="primary" (click)="addProduct()">
      <mat-icon>add</mat-icon> Add Product
    </button>
  </div>
</div>

 
  <div class="row">
    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let item of filteredProducts">
      <mat-card class="example-card" appearance="outlined" style=" zoom: 0.7;">
        <mat-card-header>
          <mat-card-title-group>
            <mat-card-title>{{ item.productName }}</mat-card-title>
            <mat-card-subtitle>Price: {{ item.price }} Rs</mat-card-subtitle>
            <img src="images/crackersimage/OIP.webp" 
                 style="width: 50px;height: 50px;">
          </mat-card-title-group>
        </mat-card-header>
<mat-divider></mat-divider>
        <mat-card-content>
          <div class="row">
            <div class="col-sm">
              Quantity: {{ item.baseQuantity }}
            </div>
            <div class="col-sm">
              Stack: {{ item.currentstack }}
            </div>
          </div>
         
        </mat-card-content>

        <mat-action-list style="display: flex; zoom: 0.8;">
          <div>
            <button class="button edit-btn" (click)="editProduct(item)">
              <div class="trash">
                <i class="bi bi-scissors"></i>
              </div>
              <span>Edit</span>
            </button>
          </div>
          <div>
            <button class="button delete-btn" (click)="deleteProduct(item)">
              <div class="trash">
                <div class="top">
                  <div class="paper"></div>
                </div>
                <div class="box"></div>
                <div class="check">
                  <svg viewBox="0 0 8 6">
                    <polyline points="1 3.4 2.71428571 5 7 1"></polyline>
                  </svg>
                </div>
              </div>
              <span>Delete Item</span>
            </button>
          </div>
        </mat-action-list>
      </mat-card>
    </div>
  </div>
</div>
